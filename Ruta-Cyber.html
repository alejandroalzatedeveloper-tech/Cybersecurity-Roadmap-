ber/ens`\r\n- **NIS2**: `https://digital-strategy.ec.europa.eu`\r\n- **DORA** (resiliencia financiera): `https://www.esma.europa.eu`\r\n- **CSA (Cloud Security Alliance)**: `https://cloudsecurityalliance.org`\r\n\r\n---\r\n\r\n## PARTE C — Cómo no abandonar (la parte que nadie cuenta)\r\n\r\n1. **El enemigo real es el \"learn-while-doing\" mal gestionado:** Estate 5 horas leyendo sin tocar nada y te sientes productivo, pero no avanzas. **Solución:** la regla del 50/50 en la sesión.\r\n2. **Es un maratón de 3 años.** La constancia gana a la intensidad. 2h/día \u003e 12h el domingo.\r\n3. **Las mesetas son normales.** Viene un día donde no entiendes Kerberos, o donde un lab te lleva 5 h. **La solución:** mira la solución/writeup, entiende por qué no lo viste, anótalo, sigue. No abandones la semana.\r\n4. **No busques la perfección.** Entiende el 70 % de un tema, pasa al siguiente, vuelve a los 3 meses. El relleno se rellena.\r\n5. **Documenta desde hoy.** Tu repo de notas es lo que te va a diferenciar en una entrevista.\r\n6. **Busca comunidad:** en Twitter/X con #cybersecurity, en Discord de HTB/THM, en r/netsec, en r/ReverseEngineering, y en **foros**. Estudiar solo es más lento.\r\n7. **Compromiso de entrevista:** cuando llegues a Fase 2, empieza a hacer entrevistas aunque no te sientas listo. La práctica de entrevistas es una habilidad propia.\r\n8. **No te aferrantes a la certificación al principio.** Las certificaciones no importan nada hasta la Fase 2-3. Antes, conocimiento puro.\r\n9. **Automatiza lo repetitivo:** cada tarea repetida (encender VMs, montar snapshot, bajar labs) debería ser un script. Empieza AHORA.\r\n10. **Celebra los hitos:** cada 20 labs, cada 100 h, cada cert → haz algo que te guste. La sostenibilidad importa.\r\n\r\n---\r\n\r\n## PARTE D — Resumen ejecutivo (para tener a mano)\r\n\r\n```\r\n╔══════════════════════════════════════════════════════════════════╗\r\n║  TU HARDWARE: i7-1185G7 · 48 GB RAM · T500 4 GB · NVMe 954 GB   ║\r\n║  LIMITACIÓN CLAVE: GPU débil → NO compres para cracking.       ║\r\n║  VENTAJA CLAVE: 48 GB RAM → puedes correr AD multi-DC real.     ║\r\n╠══════════════════════════════════════════════════════════════════╣\r\n║  ARQUITECTURA:                                                  ║\r\n║    Kali (8GB/4vCPU) + DC01 (4GB) + DC02 (4GB) + CA01 (4GB)     ║\r\n║    + VulnHub/HTB (2-4GB)  = ~26 GB VMs + 11 GB host            ║\r\n║    + WSL2 (8GB) + Docker (6-8GB) →respeta la suma              ║\r\n╠══════════════════════════════════════════════════════════════════╣\r\n║  FASE 0: 130h  → Red, Linux, Windows, Python, cripto           ║\r\n║  FASE 1: 300h  → Web pentest, enumeración, privesc, primOS INTRO ║\r\n║  FASE 2: 450h  → AD profundo, exploit dev, cloud, malware, DT   ║\r\n║  FASE 3: 800h  → Especialización (Red/Blue/Cloud) + leadership   ║\r\n║  FASE 4: 1000h → Investigación, liderazgo, publicaciones         ║\r\n║  TOTAL:  ~2680h ≈ 3 años a 20h/semana                            ║\r\n╠══════════════════════════════════════════════════════════════════╣\r\n║  REGLA DE ORO: 30% teoría / 50% práctica / 20% escritura        ║\r\n║  PRIMERA ACCIÓN: Monta el lab de AD, sube PortSwigger Academy.   ║\r\n╚══════════════════════════════════════════════════════════════════╝\r\n```\r\n"}]</script>

   PARSER MARKDOWN → HTML
   ════════════════════════════════════════════════════════════════ */
const CODES = [];
let seq = 0;

function esc(s){
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
function slug(s){
  return String(s).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'')
    .replace(/[^\w\s-]/g,'').trim().replace(/\s+/g,'-').slice(0,60) || 'x';
}
function hsh(s){
  let h=0; for(let i=0;i<s.length;i++){h=(h*31+s.charCodeAt(i))|0;} return 't'+(h>>>0).toString(36);
}

function inline(s){
  const links = [];
  const L = (t,u)=>{links.push({t,u}); return '\u0001'+(links.length-1)+'\u0001';};
  s = s.replace(/\u0000CODE(\d+)\u0000/g,(m,n)=>'\u0000B'+(+n+1)+'\u0000');
  s = s.replace(/!\[([^\]]*)\]\(([^)\s]+)\)/g,(m,a,uu)=>L(a,uu));
  s = s.replace(/\[([^\]]+)\]\(([^)\s]+)\)/g,(m,a,uu)=>L(a,uu));
  s = s.replace(/(^|[\s(>])(https?:\/\/[^\s<>()\u0001]+[^\s<>()\u0001.,;:])/g,(m,p,uu)=>p+L(uu,uu));
  s = s.replace(/`([^`\n]+)`/g,'<code>$1</code>');
  s = s.replace(/\*\*\*([^*]+)\*\*\*/g,'<strong><em>$1</em></strong>');
  s = s.replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>');
  s = s.replace(/(^|[\s(>])\*([^*\n]+)\*/g,'$1<em>$2</em>');
  s = s.replace(/(^|[\s(>])_([^_\n]+)_/g,'$1<em>$2</em>');
  s = s.replace(/~~([^~]+)~~/g,'<s>$1</s>');
  s = s.replace(/\u0001(\d+)\u0001/g,(m,n)=>{
    const l = links[n], abs = /^https?:/.test(l.u);
    return '<a class="xt" href="'+l.u+'"'+(abs?' target="_blank" rel="noopener noreferrer"':'')+'>'+l.t+'</a>';
  });
  s = s.replace(/\u0000B(\d+)\u0000/g,(m,n)=>{
    const c = CODES[n-1];
    return '<pre data-lang="'+esc(c.l)+'"><code>'+esc(c.c.replace(/\n$/,''))+'</code></pre>';
  });
  return s;
}

function renderList(items, tag){
  const min = Math.min.apply(null, items.map(i=>i.i));
  let h = '<'+tag+'>', i = 0;
  while(i < items.length){
    if(items[i].i > min){
      const sub = [];
      while(i < items.length && items[i].i > min){ sub.push(items[i]); i++; }
      h += renderList(sub, tag);
      continue;
    }
    const it = items[i]; i++;
    const t = it.t.match(/^\[([ xX])\]\s*([\s\S]*)$/);
    if(t){
      h += '<li class="task"><label class="taskbox"><input type="checkbox" data-task="'+hsh(t[2])+'"'+
           (t[1].toLowerCase()==='x'?' checked':'')+'><span>'+inline(t[2])+'</span></label></li>';
    } else {
      h += '<li>'+inline(it.t)+'</li>';
    }
  }
  return h+'</'+tag+'>';
}

function renderTable(rows){
  const cells = r => r.trim().replace(/^\|/,'').replace(/\|$/,'').split('|').map(c=>c.trim());
  let h = '<table><thead><tr>'+cells(rows[0]).map(c=>'<th>'+inline(c)+'</th>').join('')+'</tr></thead><tbody>';
  for(let i=2;i<rows.length;i++){
    if(!rows[i].trim()) continue;
    h += '<tr>'+cells(rows[i]).map(c=>'<td>'+inline(c)+'</td>').join('')+'</tr>';
  }
  return h+'</tbody></table>';
}

function parse(md){
  const lines = md.split(/\r?\n/);
  let out = '', i = 0, buf = null, tag = null;
  const flush = ()=>{ if(buf){ out += renderList(buf, tag)+'\n'; buf=null; tag=null; } };
  const isHR = l => /^\s*(-{3,}|\*{3,}|_{3,})\s*$/.test(l);
  const isItem = l => /^(\s*)([-*+]|\d+[.)])\s+/.test(l);
  const isHead = l => /^#{1,6}\s/.test(l);
  const isQuote = l => /^\s*>/.test(l);
  const isRow = l => /^\s*\|/.test(l);

  while(i < lines.length){
    const l = lines[i];
    if(/^\u0000CODE\d+\u0000/.test(l)){ flush(); out += l+'\n'; i++; continue; }
    if(isHR(l)){ flush(); out += '<hr>\n'; i++; continue; }
    if(isRow(l) && i+1<lines.length && /^\s*\|[\s:|-]+\|?\s*$/.test(lines[i+1])){
      flush(); const rows=[]; while(i<lines.length && isRow(lines[i])){ rows.push(lines[i]); i++; }
      out += renderTable(rows)+'\n'; continue;
    }
    let m = l.match(/^(#{1,6})\s+(.*?)\s*#*\s*$/);
    if(m){ flush(); const n=m[1].length; out += '<h'+n+' id="'+slug(m[2])+'">'+inline(m[2])+'</h'+n+'>\n'; i++; continue; }
    if(isQuote(l)){
      flush(); const bq=[];
      while(i<lines.length && (isQuote(lines[i]) || (bq.length && lines[i].trim() && !isHead(lines[i]) && !isItem(lines[i])))){
        bq.push(lines[i].replace(/^\s*>\s?/,'')); i++;
      }
      out += '<blockquote>'+parse(bq.join('\n'))+'</blockquote>\n'; continue;
    }
    m = l.match(/^(\s*)([-*+]|\d+[.)])\s+([\s\S]*)$/);
    if(m){
      const t = /\d/.test(m[2]) ? 'ol' : 'ul';
      if(tag !== t){ flush(); buf=[]; tag=t; }
      buf.push({i:m[1].replace(/\t/g,'  ').length, t:m[3]});
      i++; continue;
    }
    if(!l.trim()){ flush(); i++; continue; }
    flush();
    const p=[];
    while(i<lines.length && lines[i].trim() && !isHead(lines[i]) && !isItem(lines[i]) &&
          !isQuote(lines[i]) && !isRow(lines[i]) && !isHR(lines[i]) && !/^\u0000CODE\d+\u0000/.test(lines[i])){
      p.push(lines[i].trim()); i++;
    }
    if(p.length) out += '<p>'+inline(p.join(' '))+'</p>\n';
  }
  flush();
  return out;
}

function html(md){
  CODES.length = 0;
  const src = md.replace(/```([\w+#-]*)[ \t]*\r?\n([\s\S]*?)```/g,(m,l,c)=>{
    CODES.push({l:(l||'').toLowerCase(), c:c});
    return '\u0000CODE'+(CODES.length-1)+'\u0000';
  });
  return parse(src);
}

const VISTAS = [];
function buildViews(){
  DOCS.forEach(d=>{
    const re = new RegExp('^#{'+d.nivel+'} +(.+)$','gm');
    const hits = []; let m;
    while((m = re.exec(d.txt)) !== null) hits.push({t:m[1].trim(), at:m.index});
    if(!hits.length){ VISTAS.push(mk(d,'',d.txt,0)); return; }
    const pre = d.txt.slice(0, hits[0].at).trim();
    if(pre.length > 80) VISTAS.push(mk(d,'Prólogo',pre,0));
    hits.forEach((h,k)=>{
      const end = k+1 < hits.length ? hits[k+1].at : d.txt.length;
      let fz = d.fase;
      if(d.autoFase){
        const mt = h.t.match(/FASE\s*([0-4])/i);
        fz = mt ? parseInt(mt[1],10) : null;
      }
      VISTAS.push(mk(d, h.t, d.txt.slice(h.at, end), fz));
    });
  });
}
function mk(d, titulo, crudo, fase){
  const id = 'v'+(seq++);
  const cuerpo = html(crudo);
  const n = (cuerpo.match(/data-task="/g)||[]).length;
  const dm = crudo.match(/(\d+(?:[.,]\d+)?)\s*h\b/i);
  return {id, doc:d.doc, titulo, fase, crudo, cuerpo, n, horas:dm?parseFloat(dm[1].replace(',','.')):0};
}

function nHechasVista(v){

function pctVista(v){ return v.n ? Math.round(nHechasVista(v)/v.n*100) : 0; }
function faseStats(f){
  const vs = VISTAS.filter(v=>v.fase===f);
  const t = vs.reduce((a,v)=>a+v.n,0);
  const h = vs.reduce((a,v)=>a+nHechasVista(v),0);
  return {t, h, p: t?Math.round(h/t*100):0, vs};
}

function semanaActual(){
  if(E.sem) return Math.min(52, Math.max(1, E.sem));

}
function trimestre(s){

/* ════════════════════════════════════════════════════════════════
   RESPALDO: EXPORTAR / IMPORTAR PROGRESO
   El estado vive entero en el objeto E, así que basta con
   volcarlo a un JSON. Eso permite llevarlo a otro dispositivo
   pegándolo en un textarea, sin cuentas ni servidores.
   ════════════════════════════════════════════════════════════════ */
function huella(){
  // Huella del contenido: si cambian los checkboxes, los ids (hash del
  // texto) cambian y una copia antigua puede quedar medio huérfana.
  return hsh(Array.from(conocidos()).sort().join('|'));
}
var _CONOCIDOS = null;
// Set con los ids de check que existen de verdad en ESTA versión del
// contenido. Sirve para tirar fuera lo que venga en una copia ajena o
// de una versión anterior del roadmap.
function conocidos(){
  if(_CONOCIDOS) return _CONOCIDOS;
  const s = new Set();
  if(typeof VISTAS !== 'undefined') VISTAS.forEach(v=>{
    (String(v.cuerpo).match(/data-task="([^"]+)"/g)||[]).forEach(m=>s.add(m.slice(11,-1)));
  });
  return (_CONOCIDOS = s);
}
// Convierte cualquier cosa en un estado válido. Un fichero pegado a mano
// puede traer tipos raros (tareas como texto, inicio como "x"): sin esto,
// Object.assign copiaría los índices de un string como si fueran checks.
function sanear(estado){
  const limpio = {tareas:{}, inicio:Date.now(), sem:0, tema:'cyber', horas:{}};
  if(!estado || typeof estado !== 'object') return limpio;
  const t = estado.tareas;
  if(t && typeof t === 'object' && !Array.isArray(t)){
    const ok = conocidos();
    for(const k in t){
      // solo ids que existen aquí, y solo si el valor es "marcado"
      if(ok.has(k) && (t[k] === 1 || t[k] === true)) limpio.tareas[k] = 1;
    }
  }
  const f = Number(estado.inicio);
  if(isFinite(f) && f > 0) limpio.inicio = f;
  const s = Number(estado.sem);
  if(isFinite(s)) limpio.sem = Math.min(52, Math.max(0, Math.round(s)));
  if(typeof estado.tema === 'string' && estado.tema.length < 20) limpio.tema = estado.tema;
  if(estado.horas && typeof estado.horas === 'object') limpio.horas = estado.horas;
  return limpio;
}
function paquete(){
  return {app:'ruta-cyber', version:1, clave:K, exporting:new Date().toISOString(), huella:huella(), estado:E};
}
function descargar(obj, nombre){
  const url = URL.createObjectURL(new Blob([JSON.stringify(obj, null, 2)], {type:'application/json'}));
  const a = document.createElement('a');
  a.href = url; a.download = nombre;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url), 1500);
}
function fechaCorta(){
  const d = new Date(), p = n => String(n).padStart(2,'0');
  return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate());
}
// Fusión defensiva: nunca se desmarca nada al importar. Los checks se
// unen (OR) y se toma la fecha más antigua y la semana más avanzada.
function fusionar(a, b){
  // a y b ya vienen saneados por sanear(): tareas es un objeto plano
  // y sus claves son ids que existen en esta versión.
  const tareas = Object.assign({}, a.tareas, b.tareas);
  for(const k in a.tareas) if(a.tareas[k] || b.tareas[k]) tareas[k] = 1;
  return {
    tareas: tareas,
    // el inicio más antiguo = el plan más avanzado en semanas
    inicio: Math.min(a.inicio || Date.now(), b.inicio || Date.now()),
    sem:    Math.max(a.sem || 0, b.sem || 0),
    tema:    b.tema || a.tema || 'cyber',
    horas:   Object.assign({}, a.horas, b.horas)
  };
}
function aplicarPaquete(paq, modo){
  if(!paq || typeof paq !== 'object' || paq.app !== 'ruta-cyber'){
    toast('Ese fichero no es un progreso de esta app'); return false;
  }
  const limpio = sanear(paq.estado);
  const antes = Object.keys(E.tareas||{}).length;
  // checks que venían en la copia pero no existen en esta versión del roadmap
  const total = (paq.estado && typeof paq.estado.tareas === 'object' && paq.estado.tareas)
    ? Object.keys(paq.estado.tareas).length : 0;
  const descartados = Math.max(0, total - Object.keys(limpio.tareas).length);
  if(paq.huella && paq.huella !== huella())
    toast('Aviso: el contenido de la app ha cambiado, algún check puede no cuadrar');
  if(modo === 'reemplazar'){
    E = Object.assign(limpio, {tareas: limpio.tareas, vista: E.vista});
  }else{
    E = Object.assign(fusionar(sanear(E), limpio), {vista: E.vista});
  }
  save(); pintar();
  const n = Object.keys(E.tareas).length;
  const extra = descartados ? ' ('+descartados+' checks no existen en esta versión y se ignoraron)' : '';
  toast(modo === 'reemplazar'
    ? 'Progreso restaurado: '+n+' checks'+extra
    : 'Progreso fusionado: '+antes+' -> '+n+' checks'+extra);
  return true;
}

function wire(){
  app.querySelectorAll('[data-go]').forEach(a=>a.addEventListener('click',e=>{e.preventDefault();ir(a.dataset.go);}));
  app.querySelectorAll('[data-w]').forEach(b=>b.addEventListener('click',()=>{
    E.sem = Math.min(52, Math.max(1, semanaActual() + (+b.dataset.w))); save(); pintar();
  }));
  const ri = app.querySelector('[data-reinicio]');
  if(ri) ri.addEventListener('click',()=>{ E.inicio=Date.now(); E.sem=1; save(); pintar(); toast('Plan reiniciado en la semana 1'); });
  const rt = app.querySelector('[data-reset-todo]');
  if(rt) rt.addEventListener('click',()=>{
    if(!confirm('¿Borrar TODO tu progreso?\n\nSe quitarán los checks marcados, la fecha de inicio y la semana actual.\n\nNo se puede deshacer.')) return;
    try{ localStorage.removeItem(K); }catch(e){}
    E = {tareas:{}, tema:E.tema, vista:'inicio', sem:0, inicio:Date.now(), horas:{}};
    save(); pintar(); toast('Progreso borrado. Empiezas de cero.');
  });

  const ex = app.querySelector('[data-exportar]');
  if(ex) ex.addEventListener('click',()=>{
    const n = Object.keys(E.tareas||{}).length;
    if(!n && !E.sem){ toast('No hay nada que guardar todavía'); return; }
    try{ descargar(paquete(), 'cyber-progreso-'+fechaCorta()+'.json'); toast('Copia descargada: '+n+' checks'); }
    catch(e){ toast('Tu navegador bloqueó la descarga: usa "Copiar al portapapeles"'); }
  });
  const exc = app.querySelector('[data-exportar-clip]');
  if(exc) exc.addEventListener('click',async()=>{
    const txt = JSON.stringify(paquete());
    const ta = app.querySelector('#tpaste');
    try{
      await navigator.clipboard.writeText(txt);
      toast('Copiado. Pégalo en el otro dispositivo.');
    }catch(e){
      // clipboard bloqueado (permisos o file://): cae al textarea manual
      if(ta){
        ta.value = txt; ta.focus(); ta.select();
        document.execCommand && document.execCommand('copy');
        toast('Copiado al portapapeles (o selecciónalo y pulsa Ctrl+C)');
      } else { toast('No se pudo copiar: usa "Guardar copia"'); }
    }
  });
  const im = app.querySelector('[data-importar]');
  const fi = app.querySelector('#fimport');
  if(im && fi) im.addEventListener('click',()=>fi.click());
  if(fi) fi.addEventListener('change',()=>{
    const f = fi.files && fi.files[0];
    if(!f) return;
    const fr = new FileReader();
    fr.onload = ()=>{
      let paq; try{ paq = JSON.parse(fr.result); }catch(e){ toast('El fichero no es un JSON válido'); return; }
      if(aplicarPaquete(paq,'fusionar')) fi.value = '';
    };
    fr.readAsText(f);
  });
  app.querySelectorAll('[data-aplicar]').forEach(b=>b.addEventListener('click',()=>{
    const ta = app.querySelector('#tpaste');
    if(!ta || !ta.value.trim()){ toast('Pega primero el progreso en el cuadro de texto'); return; }
    let paq; try{ paq = JSON.parse(ta.value); }catch(e){ toast('El texto pegado no es un JSON válido'); return; }
    if(aplicarPaquete(paq, b.dataset.aplicar)) ta.value = '';
  }));
  app.querySelectorAll('#wkin,#wkin2').forEach(i=>i.addEventListener('change',()=>{
    E.sem = Math.min(52, Math.max(1, parseInt(i.value)||1)); save(); pintar();
  }));
  app.querySelectorAll('[data-fase]').forEach(r=>r.addEventListener('click',()=>{
    const f = r.dataset.fase;
    const vs = f === 'transversal' ? VISTAS.filter(v=>v.fase===null) : VISTAS.filter(v=>v.fase===+f);
    if(vs.length) ir(vs[vs.length-1].id);
  }));
}

/* ════════════════════════════════════════════════════════════════
   BÚSQUEDA
   ════════════════════════════════════════════════════════════════ */
function norm(s){ return s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,''); }
function buscar(q){
  q = norm(q.trim());
  if(q.length < 2) return [];
  const terms = q.split(/\s+/).filter(t=>t.length>1);
  const out = [];
  for(const v of VISTAS){
    const t = norm(v.crudo);
    const title = norm(v.titulo||'');
    let score = 0, firstAt = -1;
    for(const term of terms){
      const re = new RegExp(term.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'),'g');
      const nt = (title.match(re)||[]).length * 12;
      const nb = (t.match(re)||[]).length;
      if(!nb) score = -1;
      if(score>=0){
        score += nt + Math.min(nb,12);
        const at = t.indexOf(term);
        if(at>=0 && (firstAt<0||at<firstAt)) firstAt = at;
      }
    }
    if(score>0) out.push({v, s:score, at:firstAt});
  }
  return out.sort((a,b)=>b.s-a.s).slice(0,40);
}
function snip(crudo, at, q){
  const s = at<0?0:Math.max(0,at-110);
  let frag = crudo.slice(s, s+290).replace(/[#*`>|]/g,' ').replace(/\s+/g,' ').trim();
  const nq = norm(q.split(/\s+/)[0]||'');
  let i = norm(frag).indexOf(nq);
  if(i<0) i=0;
  const ini = Math.max(0, i-70);
  const out = frag.slice(ini, ini+240);
  return (s>0?'… ':'') + out.replace(new RegExp('('+nq.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')','i'),'<mark>$1</mark>') + ' …';
}
function renderRes(q){
  const r = buscar(q);
  let h = '<div class="res"><div class="rescount">'+r.length+' resultado'+(r.length===1?'':'s')+' para “'+esc(q)+'”</div>';
  if(!r.length) h += '<div class="card"><h3>Sin resultados</h3><div class="sub">Prueba con: ADCS, Kerberoasting, Kerberos, smuggling, Sigma, Volatility, PIV, AES, GOAD…</div></div>';
  r.forEach(x=>{
    h += '<button class="hitcard" data-go="'+x.v.id+'"><span class="loc">'+x.v.doc+' · '+(x.v.titulo||'Prólogo').slice(0,52)+'</span>'+
      '<h5>'+corta(x.v.titulo||'Prólogo',70)+'</h5><p>'+snip(x.v.crudo, x.at, q)+'</p></button>';
  });
  h += '</div>';
  app.innerHTML = h;
  app.querySelectorAll('[data-go]').forEach(b=>b.addEventListener('click',()=>{qEl.value='';$('#sw').classList.remove('has');ir(b.dataset.go);}));
  renderSidebar();
}

/* ════════════════════════════════════════════════════════════════
   CONTROLES
   ════════════════════════════════════════════════════════════════ */
const qEl = $('#q');
let tmr;
qEl.addEventListener('input',()=>{
  $('#sw').classList.toggle('has', !!qEl.value);
  clearTimeout(tmr);
  tmr = setTimeout(()=>{
    const v = qEl.value.trim();
    if(v.length>=2) renderRes(v);
    else pintar();
  }, 190);
});
$('#qclr').addEventListener('click',()=>{ qEl.value=''; $('#sw').classList.remove('has'); qEl.focus(); pintar(); });
$('#tema').addEventListener('click',()=>setTema(E.tema==='cyber'?'lector':'cyber'));
function setTema(t){
  E.tema=t; save();
  document.documentElement.setAttribute('data-tema',t);
  $('#tema').textContent = t==='cyber' ? '◐ LECTOR' : '◈ CYBER';
  $('#tema').classList.toggle('on', t==='lector');
}
$('#reset').addEventListener('click',()=>{
  if(!confirm('¿Borrar TODO el progreso (checkboxes y posición)?\n\nNo se puede deshacer.')) return;
  E = {tareas:{}, tema:E.tema, vista:'inicio', sem:0, inicio:Date.now(), horas:{}};
  save(); pintar(); toast('Progreso reiniciado');
});
$('#pdf').addEventListener('click',()=>{
  // Sin esto el PDF salía en blanco: @media print esconde #app y
  // muestra #docall, que solo se rellena en modoImprimir().
  modoImprimir();
  toast('En el diálogo elige "Guardar como PDF"');
  setTimeout(()=>window.print(), 400);
});
// Ctrl+P tambien genera el documento completo
window.addEventListener('beforeprint',()=>{ modoImprimir(); });
$('#menu').addEventListener('click',()=>$('#sb').classList.toggle('open'));
document.addEventListener('keydown',e=>{
  const typing = /^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement.tagName);
  if(e.key==='/' && !typing){ e.preventDefault(); qEl.focus(); qEl.select(); }
  if(e.key==='Escape'){ if(document.activeElement===qEl){ qEl.value=''; $('#sw').classList.remove('has'); qEl.blur(); pintar(); } else $('#sb').classList.remove('open'); }
  if((e.key==='t'||e.key==='T') && !typing) setTema(E.tema==='cyber'?'lector':'cyber');
});
function toast(m){
  const t=$('#toast'); t.textContent=m; t.classList.add('on');
  clearTimeout(t._t); t._t=setTimeout(()=>t.classList.remove('on'),1900);
}
window.addEventListener('hashchange',()=>{ const h=location.hash.slice(1); if(BY[h]) ir(h); });

/* ════════════════════════════════════════════════════════════════
   MODO IMPRESIÓN / PDF
   ════════════════════════════════════════════════════════════════ */
function modoImprimir(){
  // Idempotente: se puede llamar desde el botón, desde Ctrl+P y al
  // cargar con ?imprimir=1 sin duplicar contenido.
  if(document.body.classList.contains('modo-pdf')) return;
  document.body.classList.add('modo-pdf');
  const dc = $('#docall');
  // No se borra .topbar ni .layout: se ocultan por CSS. Así, si el
  // usuario cancela el diálogo de impresión, la app sigue intacta.
  let h = '<div class="volver no-print"><button id="salirpdf">&larr; Volver a la aplicaci&oacute;n</button></div>';
  h += '<div class="portada"><h1>RUTA CYBERSEGURIDAD<br>De Nivel 0 a Senior</h1>'+
    '<p>Plan de estudio completo en 5 fases · 52 semanas · ≈2.700 horas · 3 documentos · labs, checklists y recursos.</p>'+
    '<p style="margin-top:8px"><span class="tag">FASE 0 CIMIENTOS</span> <span class="tag">FASE 1 PRINCIPIANTE</span> <span class="tag">FASE 2 INTERMEDIO</span> <span class="tag">FASE 3 AVANZADO</span> <span class="tag">FASE 4 SENIOR</span></p>'+
    '<p style="margin-top:10px;font-size:10pt;color:#555">Regla 30/50/20 — 30 % teoría, 50 % práctica, 20 % escritura. Todo el material es de uso educativo y de laboratorio autorizado.</p></div>';
  h += '<div class="portada"><h1>Índice de capítulos</h1><p>Navegación por documento y fase.</p></div>';
  h += '<ul style="font-size:10pt;line-height:1.7">';
  const docs={}; VISTAS.forEach(v=>{(docs[v.doc]=docs[v.doc]||[]).push(v)});
  for(const k in docs){ h += '<li style="margin-bottom:2pt"><b>'+k.toUpperCase()+'</b></li>';
    docs[k].forEach(v=>{ h += '<li style="margin-left:14pt">'+esc(v.titulo||'Prólogo')+(v.n?' <span style="color:#777">('+v.n+' objetivos)</span>':'')+'</li>'; }); }
  h += '</ul>';
  h += '<div class="portada" style="page-break-before:always"><h1>Plan de 52 semanas</h1><p>15-20 h/semana · 13-15 h con la rutina base.</p></div>';
  h += '<table style="font-size:8.5pt"><thead><tr><th style="width:8%">Sem</th><th style="width:12%">Trimestre</th><th>Foco</th><th style="width:32%">Entregable</th></tr></thead><tbody>';
  PLAN.forEach((p,i)=>{ const q=trimestre(i+1);
    h += '<tr><td><b>'+(i+1)+'</b></td><td>'+q[0]+'</td><td>'+esc(p[0])+'</td><td>'+esc(p[1])+'</td></tr>'; });
  h += '</tbody></table>';
  VISTAS.forEach(v=>{
    const et = v.fase===null ? 'Transversal' : 'Fase '+v.fase;
    h += '<div class="vista"><div class="phead"><b>'+esc(v.doc)+'</b>'+
         '<span><span class="pf">'+et+'</span> · '+(v.n? v.n+' objetivos':'')+'</span></div>'+v.cuerpo+'</div>';
  });
  dc.innerHTML = h;
  const b = $('#salirpdf');
  if(b) b.addEventListener('click', salirModoImprimir);
}
function salirModoImprimir(){
  document.body.classList.remove('modo-pdf');
  $('#docall').innerHTML = '';
  pintar();
}
if(ES_IMPRIMIR) modoImprimir();
else { setTema(E.tema||'cyber'); pintar(); }
